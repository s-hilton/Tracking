# Applies the SQL files in supabase/migrations to your Supabase project.
#
#  - Pull request touching supabase/: shows what WOULD be applied (dry run).
#  - Push to main touching supabase/: applies new migrations for real.
#  - Actions tab → "Supabase database" → Run workflow: apply on demand.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID
# Until they are set, the job skips itself instead of failing.
name: Supabase database

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  pull_request:
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::Supabase secrets are not set yet; skipping. See docs/SUPABASE_SETUP.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview migrations (pull request)
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'pull_request'
        run: supabase db push --dry-run

      - name: Apply migrations
        if: steps.secrets.outputs.ready == 'true' && github.event_name != 'pull_request'
        run: supabase db push
