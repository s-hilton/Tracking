# Applies supabase/auth.json to your Supabase project's sign-in settings
# (Authentication → URL Configuration): where confirmation and password-reset
# emails link back to. Runs when that file changes on main, or on demand from
# the Actions tab. Uses the same secrets as the database workflow.
name: Supabase auth URLs

on:
  push:
    branches: [main]
    paths: ['supabase/auth.json']
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::Supabase secrets are not set yet; skipping. See docs/SUPABASE_SETUP.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Update site URL and redirect URLs
        if: steps.secrets.outputs.ready == 'true'
        run: |
          body=$(jq '{site_url, uri_allow_list: (.redirect_urls | join(","))}' supabase/auth.json)
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$body" | jq '{site_url, uri_allow_list}'
